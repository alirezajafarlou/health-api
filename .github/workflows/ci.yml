name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      AUTH_DISABLED: "true"
      MONITOR_ENABLED: "false"
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: healthapi
      DB_PASSWORD: healthapi-ci
      DB_NAME: healthapi

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: healthapi
          POSTGRES_PASSWORD: healthapi-ci
          POSTGRES_DB: healthapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthapi -d healthapi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up database
        run: |
          PGPASSWORD=$DB_PASSWORD psql \
            -h $DB_HOST \
            -U $DB_USER \
            -d $DB_NAME \
            -f db/schema.sql

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --pull \
            -t health-api:ci \
            .

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image for GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag health-api:ci ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag health-api:ci ghcr.io/${{ github.repository }}:latest

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest
